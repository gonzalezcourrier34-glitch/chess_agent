name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ---------------------------------------------------------------------------
  # Qualité et tests Python
  # ---------------------------------------------------------------------------

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check backend tests

      - name: Ruff format
        run: uv run ruff format --check backend tests

      - name: Pyright
        run: uv run pyright


  # ---------------------------------------------------------------------------
  # Tests unitaires + couverture
  # ---------------------------------------------------------------------------

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests with coverage
        run: >
          uv run pytest
          tests/unit
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=86

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: coverage.xml


  # ---------------------------------------------------------------------------
  # Build Docker
  # ---------------------------------------------------------------------------

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker Compose services
        run: docker compose build


  # ---------------------------------------------------------------------------
  # Tests de déploiement
  # ---------------------------------------------------------------------------

  deployment-tests:
    name: Deployment tests
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start application
        run: docker compose up -d

      - name: Show running containers
        run: docker compose ps

      - name: Wait for backend
        shell: bash
        run: |
          echo "Waiting for backend..."

          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/openapi.json > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi

            sleep 5
          done

          echo "Backend did not become ready in time."
          docker compose logs
          exit 1

      - name: Wait for frontend
        shell: bash
        run: |
          echo "Waiting for frontend..."

          for i in {1..30}; do
            if curl --fail --silent http://localhost:4200 > /dev/null; then
              echo "Frontend is ready."
              exit 0
            fi

            sleep 5
          done

          echo "Frontend did not become ready in time."
          docker compose logs
          exit 1

      - name: Run deployment tests
        run: >
          uv run pytest
          tests/deployment
          -v

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop application
        if: always()
        run: docker compose down -v