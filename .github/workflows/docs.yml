# =============================================================================
# Documentation - GitHub Pages
# =============================================================================
#
# Ce workflow construit la documentation MkDocs puis la publie
# automatiquement sur GitHub Pages.
#
# Le fichier mkdocs.yml reste la configuration centrale de la documentation.
# Ce workflow s'occupe uniquement :
#
#   1. de construire le site statique avec MkDocs ;
#   2. d'envoyer le dossier généré à GitHub Pages ;
#   3. de publier la documentation.
#
# =============================================================================

name: Documentation


# =============================================================================
# Déclenchement
# =============================================================================

on:

  # Le workflow est lancé lorsqu'une modification est poussée
  # sur la branche principale et concerne la documentation.
  push:
    branches:
      - main

    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

  # Permet également de lancer manuellement le workflow
  # depuis l'onglet GitHub Actions.
  workflow_dispatch:


# =============================================================================
# Permissions GitHub Pages
# =============================================================================
#
# contents: read
#   permet de lire le dépôt.
#
# pages: write
#   permet de publier sur GitHub Pages.
#
# id-token: write
#   permet l'authentification sécurisée utilisée par deploy-pages.

permissions:
  contents: read
  pages: write
  id-token: write


# =============================================================================
# Gestion des déploiements simultanés
# =============================================================================
#
# Si plusieurs mises à jour sont poussées rapidement,
# seul le déploiement le plus récent est conservé.

concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:

  # ===========================================================================
  # Construction de la documentation
  # ===========================================================================

  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Récupération du dépôt
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # -----------------------------------------------------------------------
      # Installation de l'environnement Python
      # -----------------------------------------------------------------------

      # uv est utilisé dans Chess Agent pour gérer Python
      # et les dépendances du projet.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Installation de la version Python utilisée par le projet.
      - name: Install Python
        run: uv python install 3.12

      # Installe les dépendances exactement telles qu'elles sont
      # définies dans uv.lock.
      #
      # MkDocs et MkDocs Material doivent donc être présents
      # dans les dépendances du projet.
      - name: Install dependencies
        run: uv sync --frozen


      # -----------------------------------------------------------------------
      # Construction MkDocs
      # -----------------------------------------------------------------------

      # MkDocs transforme le contenu du dossier docs/
      # en site HTML statique.
      #
      # Le résultat est placé dans le dossier "site"
      # défini dans mkdocs.yml.
      #
      # --strict permet de considérer les avertissements MkDocs
      # comme des erreurs afin d'éviter de publier une documentation
      # contenant des références cassées.
      - name: Build MkDocs site
        run: uv run mkdocs build --strict


      # -----------------------------------------------------------------------
      # Préparation GitHub Pages
      # -----------------------------------------------------------------------

      # Configure GitHub Pages pour le workflow.
      - name: Setup Pages
        uses: actions/configure-pages@v5


      # -----------------------------------------------------------------------
      # Création de l'artifact Pages
      # -----------------------------------------------------------------------

      # Le dossier "site" contient le site statique généré par MkDocs.
      #
      # Cet artifact sera récupéré par le job de déploiement.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site


  # ===========================================================================
  # Publication sur GitHub Pages
  # ===========================================================================

  deploy:
    name: Deploy documentation

    # Le déploiement ne commence que si la construction
    # de la documentation a réussi.
    needs:
      - build

    runs-on: ubuntu-latest


    # -------------------------------------------------------------------------
    # Environnement GitHub Pages
    # -------------------------------------------------------------------------
    #
    # "github-pages" est l'environnement standard utilisé
    # par GitHub pour les déploiements Pages.
    #
    # page_url est générée automatiquement par deploy-pages.
    #
    # GitHub pourra ainsi afficher directement le lien
    # vers le site publié dans le résultat du workflow.

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      # -----------------------------------------------------------------------
      # Déploiement
      # -----------------------------------------------------------------------

      # Récupère l'artifact produit par le job "build"
      # et le publie sur GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4