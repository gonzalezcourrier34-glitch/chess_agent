openapi: 3.1.0
info:
  title: Chess Agent Internal API
  version: 1.0.0-draft
  description: Contrat minimal de conception partagé par Angular et les adaptateurs.
servers:
  - url: /api/v1
paths:
  /analyses:
    post:
      operationId: createAnalysis
      summary: Analyse une position d'échecs de façon idempotente.
      security:
        - bearerAuth: [chess:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "200":
          description: Analyse déjà connue ou calculée immédiatement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /video-index-jobs:
    post:
      operationId: createVideoIndexJob
      summary: Démarre l'indexation d'un actif vidéo autorisé.
      security:
        - bearerAuth: [video:index]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoIndexRequest"
      responses:
        "202":
          description: Job accepté.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoIndexJob"
        "403":
          description: Droits insuffisants ou non vérifiés.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /video-index-jobs/{job_id}:
    get:
      operationId: getVideoIndexJob
      summary: Lit l'état d'un job.
      security:
        - bearerAuth: [video:read]
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: État courant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoIndexJob"
        "404":
          description: Job inconnu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /video-position-search:
    post:
      operationId: searchVideoPosition
      summary: Recherche une position dans les timelines autorisées.
      security:
        - bearerAuth: [video:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fen]
              properties:
                fen:
                  type: string
                max_results:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
      responses:
        "200":
          description: Résultats classés.
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items:
                      $ref: "#/components/schemas/VideoPositionSegment"
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            chess:read: Lire et calculer des analyses.
            video:read: Lire les timelines et résultats vidéo.
            video:index: Démarrer une indexation autorisée.
  schemas:
    AnalysisRequest:
      type: object
      additionalProperties: false
      required: [request_id, fen]
      properties:
        request_id:
          type: string
          minLength: 8
          maxLength: 100
        fen:
          type: string
          minLength: 10
          maxLength: 120
        language:
          type: string
          enum: [fr, en]
          default: fr
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced, master]
          default: intermediate
    AnalysisResponse:
      type: object
      required: [request_id, status, fen, sources]
      properties:
        request_id:
          type: string
        status:
          type: string
          enum: [success, partial, error]
        fen:
          type: string
        mode:
          type: [string, "null"]
          enum: [theory, engine, null]
        opening:
          type: [object, "null"]
        best_moves:
          type: array
          items:
            type: object
        documents:
          type: array
          items:
            type: object
        videos:
          type: array
          items:
            type: object
        explanation:
          type: [string, "null"]
        sources:
          type: array
          items:
            type: object
        warnings:
          type: array
          items:
            type: string
        error:
          oneOf:
            - $ref: "#/components/schemas/ServiceError"
            - type: "null"
    VideoIndexRequest:
      type: object
      additionalProperties: false
      required: [asset_id, rights_attestation]
      properties:
        asset_id:
          type: string
        rights_attestation:
          type: string
          minLength: 10
        known_initial_fen:
          type: [string, "null"]
    VideoIndexJob:
      type: object
      required: [job_id, asset_id, status, progress]
      properties:
        job_id:
          type: string
        asset_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        progress:
          type: number
          minimum: 0
          maximum: 1
        metrics:
          type: object
        error:
          oneOf:
            - $ref: "#/components/schemas/ServiceError"
            - type: "null"
    VideoPositionSegment:
      type: object
      required:
        - video_id
        - position_kind
        - piece_placement
        - start_ms
        - end_ms
        - confidence
      properties:
        video_id:
          type: string
        position_kind:
          type: string
          enum: [piece_placement_only, partial_fen, full_fen]
        piece_placement:
          type: string
        fen:
          type: [string, "null"]
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 0
        confidence:
          type: number
          minimum: 0
          maximum: 1
        timestamp_url:
          type: [string, "null"]
          format: uri
    ServiceError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        correlation_id:
          type: [string, "null"]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ServiceError"
  responses:
    BadRequest:
      description: Entrée invalide.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Quota ou dépendance limitée.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: Service indisponible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
