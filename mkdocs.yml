site_name: Chess Agent
site_description: Documentation technique du projet Chess Agent
site_author: Stéphane Moa

docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer au thème sombre

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer au thème clair

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - admonition

  - toc:
      permalink: true

  - pymdownx.details

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde

nav:
  - Accueil: index.md

  - Projet:
      - Présentation du projet: 01-presentation-projet.md
      - Architecture technique: 02-architecture-technique.md
      - Workflow LangGraph: 03-workflow-langgraph.md
      - État et routage: 04-etat-et-routage.md

  - Backend:
      - Services applicatifs: 05-services-applicatifs.md
      - Adapters et infrastructure: 06-adapters-infrastructure.md
      - RAG et Wikichess: 07-rag-wikichess.md
      - API, contrats et erreurs: 08-api-contrats-erreurs.md
      - Modèles de données: 09-modeles-donnees.md
      - Persistance MongoDB: 10-persistance-mongodb.md
      - Cycle de vie, configuration et supervision: 11-cycle-vie-configuration-supervision.md

  - Frontend:
      - Frontend Angular: 12-frontend-angular.md
      - Cours Angular appliqué à Chess Agent: cours/cours-angular-chess-agent.md

  - Qualité:
      - Qualité et tests: 13-qualite-tests.md
      - Convention MISA: 14-convention-misa.md

  - Projet et soutenance:
      - Limites et évolutions: 15-limites-evolutions.md
      - Glossaire: 16-glossaire.md
      - Guide de présentation: 17-guide-presentation.md
      - Inventaire des sources: 18-inventaire-sources.md

  - Étude de faisabilité - Chess Video:
      - Présentation de l'étude: mcp/00_INDEX.md
      - 1. État initial et besoin: mcp/01_ETAT_INITIAL_ET_BESOIN.md
      - 2. Description du module vidéo: mcp/02_MODULE_VIDEO_CIBLE.md
      - 3. Étude technologique: mcp/03_ETUDE_TECHNOLOGIQUE.md
      - 4. Solutions techniques étudiées: mcp/04_SOLUTIONS_TECHNIQUES.md
      - 5. Architecture Chess Video avec MCP: mcp/05_ARCHITECTURE_CHESS_VIDEO_MCP.md
      - 6. Faisabilité technique: mcp/06_FAISABILITE_TECHNIQUE.md
      - 7. Faisabilité économique: mcp/07_FAISABILITE_ECONOMIQUE.md
      - 8. Bénéfices, limites et risques: mcp/08_BENEFICES_LIMITES_RISQUES.md
      - 9. Plan de développement: mcp/09_PLAN_DE_DEVELOPPEMENT.md
      - 10. Alternatives étudiées: mcp/10_ALTERNATIVES_ETUDIEES.md
      - 11. Conclusion et décision GO / NO-GO: mcp/11_CONCLUSION_GO_NOGO.md